name: Deploy to xcivcourier.com

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/themes/xciv-courier/**'
      - 'wp-content/plugins/xciv-courier-core/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy theme + core plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy XCIV Courier theme
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './wp-content/themes/xciv-courier/*'
          remote_path: ${{ secrets.FTP_REMOTE_PATH }}/wp-content/themes/xciv-courier/
          sftp_only: true
          delete_remote_files: false
          sftpArgs: '-o StrictHostKeyChecking=no'

      - name: Deploy XCIV Courier Core plugin
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './wp-content/plugins/xciv-courier-core/*'
          remote_path: ${{ secrets.FTP_REMOTE_PATH }}/wp-content/plugins/xciv-courier-core/
          # false so SSH can mkdir the plugin folder on first deploy
          sftp_only: false
          delete_remote_files: false
          sftpArgs: '-o StrictHostKeyChecking=no'
